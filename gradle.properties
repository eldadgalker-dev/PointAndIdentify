# Version 1.2
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ===== Parameters: release version =====
# Major.minor of published releases; the patch number is the release workflow run number,
# so every automatic release gets a higher versionName and versionCode.
point.versionBase=1.0

# ===== Parameters: GitHub source of data and updates =====
point.githubOwner=eldadgalker-dev
point.githubRepo=PointAndIdentify
point.githubBranch=main
point.rawHost=https://raw.githubusercontent.com
point.webHost=https://github.com
