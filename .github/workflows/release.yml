# Version 2.2
# Builds a signed release APK automatically whenever app code reaches main (or on manual run),
# creates tag v<versionBase>.<run number> and publishes a GitHub Release with
# PointAndIdentify.apk and version.json, which the in-app update button reads.
# Requires the four POINT_* signing secrets (repository secrets, set once).
name: release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to a new image in Oct 2026
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.POINT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.POINT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POINT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POINT_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing POINT_KEYSTORE_B64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing POINT_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing POINT_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing POINT_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. Add them under the repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Compute version
        id: ver
        run: |
          BASE=$(grep -E '^point.versionBase=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+$'; then echo "::error::point.versionBase must be MAJOR.MINOR"; exit 1; fi
          VERSION="$BASE.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (versionCode ${{ github.run_number }})"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub Ubuntu runners ship an Android SDK (ANDROID_HOME). The separate setup action
      # failed in run #2, so it now runs only when no SDK is present on the runner.
      - name: Detect Android SDK
        id: sdk
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Android SDK found at $ANDROID_HOME"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No preinstalled Android SDK"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android SDK (fallback)
        if: steps.sdk.outputs.present != 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.POINT_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "POINT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          POINT_KEYSTORE_PASSWORD: ${{ secrets.POINT_KEYSTORE_PASSWORD }}
          POINT_KEY_ALIAS: ${{ secrets.POINT_KEY_ALIAS }}
          POINT_KEY_PASSWORD: ${{ secrets.POINT_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -Ppoint.githubOwner=${{ github.repository_owner }} \
            -Ppoint.githubRepo=${{ github.event.repository.name }}

      - name: Package release assets
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then echo "::error::Signed APK not found"; exit 1; fi
          cp "$APK" PointAndIdentify.apk
          SHA=$(sha256sum PointAndIdentify.apk | cut -d' ' -f1)
          printf '{"versionCode": %d, "versionName": "%s", "sha256": "%s"}\n' \
            "${{ github.run_number }}" "${{ steps.ver.outputs.version }}" "$SHA" > version.json
          cat version.json
          # Anonymous counters: the app downloads these tiny files (no identifier); the release page counts the downloads.
          printf '{"purpose": "counts new installations", "versionName": "%s"}\n' "${{ steps.ver.outputs.version }}" > install.json
          printf '{"purpose": "counts devices running this version", "versionName": "%s"}\n' "${{ steps.ver.outputs.version }}" > launch.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release create "$TAG" PointAndIdentify.apk version.json install.json launch.json \
            --target "$GITHUB_SHA" --title "PointAndIdentify ${{ steps.ver.outputs.version }}" --generate-notes
