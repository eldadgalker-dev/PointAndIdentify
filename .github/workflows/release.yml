# Version 2.0
# Builds a signed release APK automatically whenever app code reaches main (or on manual run),
# creates tag v<versionBase>.<run number> and publishes a GitHub Release with
# PointAndIdentify.apk and version.json, which the in-app update button reads.
# Requires the four POINT_* signing secrets (set once by setup_once.ps1).
name: release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.POINT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.POINT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POINT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POINT_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing POINT_KEYSTORE_B64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing POINT_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing POINT_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing POINT_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. Run setup_once.bat once on your PC."
            exit 1
          fi

      - name: Compute version
        id: ver
        run: |
          BASE=$(grep -E '^point.versionBase=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+$'; then echo "::error::point.versionBase must be MAJOR.MINOR"; exit 1; fi
          VERSION="$BASE.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (versionCode ${{ github.run_number }})"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.POINT_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "POINT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          POINT_KEYSTORE_PASSWORD: ${{ secrets.POINT_KEYSTORE_PASSWORD }}
          POINT_KEY_ALIAS: ${{ secrets.POINT_KEY_ALIAS }}
          POINT_KEY_PASSWORD: ${{ secrets.POINT_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -Ppoint.githubOwner=${{ github.repository_owner }} \
            -Ppoint.githubRepo=${{ github.event.repository.name }}

      - name: Package release assets
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then echo "::error::Signed APK not found"; exit 1; fi
          cp "$APK" PointAndIdentify.apk
          SHA=$(sha256sum PointAndIdentify.apk | cut -d' ' -f1)
          printf '{"versionCode": %d, "versionName": "%s", "sha256": "%s"}\n' \
            "${{ github.run_number }}" "${{ steps.ver.outputs.version }}" "$SHA" > version.json
          cat version.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release create "$TAG" PointAndIdentify.apk version.json \
            --target "$GITHUB_SHA" --title "PointAndIdentify ${{ steps.ver.outputs.version }}" --generate-notes
