# Version 1.0
# Runs the unit tests and builds an unsigned debug APK on every push and pull request that touches app code,
# so a broken test or a compile error is reported before release.yml publishes a Release.
# Needs no secrets: the debug build is signed with the automatically generated debug key.
name: ci

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a newer push replaces the run of an older one on the same branch

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned, same as release.yml
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub Ubuntu runners ship an Android SDK (ANDROID_HOME); the setup action runs only when none is present.
      - name: Detect Android SDK
        id: sdk
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "Android SDK found at $ANDROID_HOME"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No preinstalled Android SDK"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Android SDK (fallback)
        if: steps.sdk.outputs.present != 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
