# Version 1.2
# Rejects pushes where data/manifest.json does not match the data files (the app would reject them too).
name: data-check

on:
  push:
    branches: [main]
    paths: ["data/**"]
  pull_request:
    paths: ["data/**"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify manifest
        run: python3 tools/verify_manifest.py
